name: Build TDLib for ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup QEMU
      uses: docker/setup-qemu-action@v3
    
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build TDLib in ARM64 container
      run: |
        docker run --rm --platform linux/arm64 \
          -v ${{ github.workspace }}:/workspace \
          ubuntu:22.04 bash -c "
            set -e
            apt-get update
            apt-get install -y build-essential cmake git zlib1g-dev \
              libssl-dev gperf php-cli ninja-build
            
            cd /workspace
            git clone https://github.com/tdlib/td.git
            cd td
            git checkout master
            
            mkdir -p build && cd build
            cmake -DCMAKE_BUILD_TYPE=Release \
                  -DTD_ENABLE_LTO=OFF \
                  -GNinja \
                  ..
            
            cmake --build . --target tdjson
            
            cp libtdjson.so* /workspace/
            echo 'Build complete!'
            ls -lh /workspace/libtdjson.so*
          "
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: libtdjson-arm64
        path: |
          libtdjson.so*
        retention-days: 30
